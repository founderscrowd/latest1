[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Disabled to avoid conflicts with static sitemap.xml
# [[plugins]]
# package = "@netlify/plugin-sitemap"
#
# [plugins.inputs]
# buildDir = "dist"

# SPA-only app routes: serve the SPA shell (index.html) with 200 so React Router
# can handle them. These are NOT in the sitemap and the prerendered stubs carry
# meta robots noindex. Listed explicitly so the 404 catch-all below doesn't fire.
[[redirects]]
  from = "/sign-in"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/sign-in/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/profile/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/settings/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/forgot-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/forgot-password/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
