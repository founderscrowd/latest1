[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# Disabled to avoid conflicts with static sitemap.xml
# [[plugins]]
# package = "@netlify/plugin-sitemap"
#
# [plugins.inputs]
# buildDir = "dist"

# Social crawler previews for group pages
# Facebook, Twitter, LinkedIn, and other crawlers don't run JavaScript,
# so we proxy their requests to a Supabase Edge Function that returns
# pre-rendered HTML with group-specific Open Graph meta tags.
[[redirects]]
  from = "/groups/:slug"
  to = "https://jdpugmeoocezzxqegmsu.supabase.co/functions/v2/social-preview?slug=:splat"
  status = 200
  force = false
  [redirects.conditions]
    [redirects.conditions.User-Agent]
    facebookexternalhit = ["facebookexternalhit/1.1", "facebookexternalhit/1.0"]
    Twitterbot = ["Twitterbot/1.0"]
    LinkedInBot = ["LinkedInBot/1.0"]
    WhatsApp = ["WhatsApp"]
    TelegramBot = ["TelegramBot"]
    Slackbot = ["Slackbot"]
    Discordbot = ["Discordbot"]
    Googlebot = ["Googlebot"]
    Bingbot = ["Bingbot"]

# 301: /our-vision is not a standalone page — it lives at /blog/our-vision/
[[redirects]]
  from = "/our-vision"
  to = "/blog/our-vision/"
  status = 301
  force = true

[[redirects]]
  from = "/our-vision/"
  to = "/blog/our-vision/"
  status = 301
  force = true

# SPA-only app routes: serve the SPA shell (index.html) with 200 so React Router
# can handle them. These are NOT in the sitemap and the prerendered stubs carry
# meta robots noindex. Listed explicitly so the 404 catch-all below doesn't fire.
[[redirects]]
  from = "/sign-in"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/sign-in/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/profile/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/settings/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/forgot-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/forgot-password/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/redirect"
  to = "/index.html"
  status = 200
  force = false

# Payment callback routes — SPA-only, noindex
[[redirects]]
  from = "/payment/success"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/payment/success/"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/payment/cancelled"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/payment/cancelled/"
  to = "/index.html"
  status = 200
  force = false

# Dynamic group routes (slug-based) — serve the SPA shell so React Router
# can render the group profile/detail page. The social-preview redirect above
# handles crawler requests for /groups/:slug (without trailing slash).
# The prerendered /groups/<slug>/index.html (written by the prerender script
# for public groups) takes precedence over this for known groups.
[[redirects]]
  from = "/groups/:slug/*"
  to = "/index.html"
  status = 200
  force = false

# 404 catch-all: any path that doesn't match a prerendered HTML file, a static
# asset, or one of the explicit SPA routes above serves the prerendered 404
# page with HTTP 404. This prevents unknown URLs from serving the homepage.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false
