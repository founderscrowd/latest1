[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# Disabled to avoid conflicts with static sitemap.xml
# [[plugins]]
# package = "@netlify/plugin-sitemap"
#
# [plugins.inputs]
# buildDir = "dist"

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

